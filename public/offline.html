<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d1a" />
    <title>Offline — Aviator</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: #0d0d1a; color: #e5e7eb;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .card { max-width: 22rem; text-align: center; }
      .badge {
        width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        background: #1e293b; font-size: 30px;
      }
      h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; }
      p { font-size: 0.9rem; line-height: 1.5; color: #94a3b8; margin: 0 0 22px; }
      a {
        display: inline-flex; align-items: center; justify-content: center; height: 44px;
        padding: 0 22px; border-radius: 12px; background: #ef4444; color: #fff;
        font-size: 0.9rem; font-weight: 600; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">✈️</div>
      <h1>You're offline</h1>
      <p>Aviator needs a connection for live rounds, your wallet and cashing out. Your balance and every round always come straight from the server — reconnect and try again.</p>
      <a href="/">Retry</a>
    </div>
  </body>
</html>
