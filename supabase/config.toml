# Supabase CLI configuration for aviator_v2
project_id = "yhfxgzfmcwinpgmzcgma"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions]

# The gateway JWT check is off for functions that authenticate themselves:
#   megapay-callback / megapay-reconcile: provider webhook and pg_cron (x-cron-secret)
#   brand-domains: pg_cron sweep (x-cron-secret, checked against Vault); every other action runs
#                  its RPCs AS the caller's JWT, so an anonymous or forged token gets nothing.
[functions.megapay-callback]
verify_jwt = false

[functions.megapay-reconcile]
verify_jwt = false

[functions.brand-domains]
verify_jwt = false

#   payouts-worker: pg_cron / wake-ups (x-cron-secret, checked against Vault); "test" runs its RPCs as the caller
#   payout-result:  Safaricom callbacks, authenticated by the per-attempt HMAC token in the URL
[functions.payouts-worker]
verify_jwt = false

[functions.payout-result]
verify_jwt = false
